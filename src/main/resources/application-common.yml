view:
  participants:
    pageSize: 10
  competitions:
    general:
      pageSize: 5
    detailed:
      pageSize: 3

# Notification settings
notification:
  mode: AGGREGATED  # LEGACY, AGGREGATED, or BOTH
  onlyForAdmin: false
  processor:
    cron-pattern: "0 15,45 6,10,14,18,22 * * *"
  aggregated:
    enabled: true
    cleanupAfterDays: 7
    minutesThreshold: 60

logging:
  file:
    name: ./logs/file.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Competitions settings
competition:
  # competitions that ended earlier than stale-after-months ago:
  #  - already loaded ones are not updated automatically (frozen)
  #  - not loaded ones are retried daily until they fail on stale-failed-days different days (stale)
  # manual update by admin always works
  stale-after-months: 3
  stale-failed-days: 20
  # only competitions that ended no more than N days ago (or are not finished) are polled every few minutes
  frequent-update-window-days: 7
